name: Apply owner audio upload UI

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply owner audio upload UI') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Patch create job page
        run: python3 scripts/patch_audio_upload.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pages/create_job_post/create_job_post_widget.dart
          git diff --cached --quiet && exit 0
          git commit -m "Apply owner audio upload UI"
          git push origin develop
