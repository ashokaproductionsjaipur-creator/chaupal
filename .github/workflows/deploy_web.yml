name: Deploy CHAUPAL Web

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: chaupal-pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Get packages
        run: flutter pub get

      - name: Apply worker deal confirmation fix
        shell: pwsh
        run: ./scripts/add_worker_deal_cancel_button.ps1

      - name: Fix worker confirmation button clipping
        shell: pwsh
        run: ./scripts/fix_worker_confirmation_button_clipping.ps1

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Flutter Web
        run: flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Create SPA fallback
        run: cp build/web/index.html build/web/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
