name: CHAUPAL Flutter CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - name: Normalize Android v2 embedding
        run: |
          set -eux
          rm -rf android/app/src/main/java/io/flutter/plugins
          rm -rf android/app/src/main/java/io/flutter/app
          grep -RInE 'io\.flutter\.app|PluginRegistry\.Registrar' android/app/src android 2>/dev/null || true
          grep -RIn 'flutterEmbedding' android/app/src/main/AndroidManifest.xml
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: chaupal-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
