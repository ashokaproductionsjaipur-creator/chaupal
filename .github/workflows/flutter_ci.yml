name: CHAUPAL Flutter CI
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test
      - name: Diagnose Android v1 embedding references
        run: |
          echo '--- App Android source ---'
          grep -RInE 'io\.flutter\.app|PluginRegistry\.Registrar|registerWith\(' android/app/src android 2>/dev/null || true
          echo '--- Plugin Android sources ---'
          grep -RInE 'io\.flutter\.app|PluginRegistry\.Registrar|registerWith\(' "$PUB_CACHE/hosted/pub.dev"/*/android 2>/dev/null || true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: chaupal-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
